<!--
  ============================================================
  CONFIGURACIÓN DE FIREBASE
  ============================================================
  1. Andá a https://console.firebase.google.com → "Agregar proyecto".
  2. Dentro del proyecto: Compilación (Build) → Firestore Database →
     "Crear base de datos" → modo producción → elegí una región (ej. southamerica-east1).
  3. Compilación → Authentication → pestaña "Sign-in method" → habilitá
     el proveedor "Anónimo" (Anonymous). Esto es solo para que la app
     pueda leer/escribir en Firestore de forma seleccionada; el login
     real de usuario/contraseña lo maneja esta misma app, no Firebase Auth.
  4. Ícono de engranaje (⚙) → "Configuración del proyecto" → bajá hasta
     "Tus apps" → ícono </> (Web) → registrá una app → copiá el objeto
     "firebaseConfig" que te muestra y pegalo abajo, reemplazando el que
     dice "PEGÁ_ACÁ_TU_CONFIG".
  5. En Firestore → pestaña "Reglas", pegá esto y publicá:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{document=**} {
           allow read, write: if request.auth != null;
         }
       }
     }

  ============================================================
-->
<style>
  :root{
    --bg:#161F2C;
    --panel:#212B3B;
    --panel-2:#2A3648;
    --border:#3C4A5C;
    --text:#E7EDF4;
    --text-dim:#9BA8B7;
    --accent:#00D9A5;
    --accent-dim:#0A6E56;
    --info:#3FA9F5;
    --warn:#F5A623;
    --danger:#EF4E5C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,217,165,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(63,169,245,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; margin:0;}
  ::selection{background:var(--accent-dim); color:#fff;}
  input, select, textarea, button{font-family:inherit; font-size:14px;}
  a{color:var(--info);}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--border);
    background:rgba(18,24,38,0.6); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px; height:30px; border-radius:7px;
    background:linear-gradient(155deg, var(--accent), var(--info));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:17px; height:17px;}
  .brand-text .title{font-size:15px; font-weight:600; letter-spacing:0.2px;}
  .brand-text .sub{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .who{display:flex; align-items:center; gap:12px;}
  .who .name{font-size:13px; color:var(--text-dim);}
  .who .name b{color:var(--text); font-weight:600;}
  .btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:8px 14px; border-radius:8px; cursor:pointer; transition:all .15s ease;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#04231C; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08); color:#04231C;}
  .btn.ghost{background:transparent;}
  .btn.danger{border-color:var(--danger); color:var(--danger); background:transparent;}
  .btn.danger:hover{background:var(--danger); color:#fff;}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- layout ---------- */
  .shell{max-width:1180px; margin:0 auto; padding:28px;}
  .hidden{display:none !important;}

  /* ---------- login ---------- */
  .login-wrap{
    min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow:hidden;
  }
  .signal-art{position:absolute; inset:0; opacity:0.5; pointer-events:none;}
  .login-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:32px; position:relative; z-index:1;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .login-card .brand-mark{width:42px; height:42px; margin-bottom:16px;}
  .login-card .brand-mark svg{width:24px; height:24px;}
  .login-card h1{font-size:22px; margin-bottom:4px;}
  .login-card p.lead{color:var(--text-dim); font-size:13px; margin:0 0 24px 0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; letter-spacing:0.2px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:70px;}
  .error-msg{
    background:rgba(239,78,92,0.1); border:1px solid rgba(239,78,92,0.35); color:#FF9BA4;
    padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px;
  }
  .warn-msg{
    background:rgba(245,166,35,0.1); border:1px solid rgba(245,166,35,0.35); color:var(--warn);
    padding:9px 12px; border-radius:8px; font-size:12px; margin-bottom:14px; line-height:1.5;
  }
  .ok-msg{
    background:rgba(0,217,165,0.1); border:1px solid rgba(0,217,165,0.35); color:var(--accent);
    padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px;
  }
  .hint{font-size:11.5px; color:var(--text-dim); margin-top:14px; line-height:1.5;}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:6px; margin-bottom:22px; border-bottom:1px solid var(--border);}
  .tab{
    padding:10px 4px; margin-right:18px; color:var(--text-dim); cursor:pointer;
    border-bottom:2px solid transparent; font-size:13.5px; font-weight:500; user-select:none;
  }
  .tab.active{color:var(--text); border-color:var(--accent);}
  .tab:hover{color:var(--text);}

  /* ---------- cards / panels ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px;
  }
  .panel + .panel{margin-top:20px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .panel-head h2{font-size:16px;}
  .panel-head .desc{font-size:12px; color:var(--text-dim); margin-top:3px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 18px;}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}

  .status-select{position:relative;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; flex-shrink:0;}
  .dot.ok{background:var(--accent); box-shadow:0 0 6px var(--accent);}
  .dot.falla{background:var(--danger); box-shadow:0 0 6px var(--danger);}
  .dot.na{background:var(--text-dim);}

  .check-field{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:11px 14px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .check-field:hover{border-color:#33455B;}
  .check-field.checked{border-color:var(--accent); background:rgba(0,217,165,0.07);}
  .check-field .cf-label{font-size:13px; color:var(--text); line-height:1.35; padding-right:8px;}
  .check-field input[type="checkbox"]{position:absolute; opacity:0; width:0; height:0;}
  .cf-box{
    width:22px; height:22px; border-radius:6px; border:1.5px solid var(--border);
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all .15s ease;
  }
  .check-field.checked .cf-box{background:var(--accent); border-color:var(--accent);}
  .cf-box svg{width:13px; height:13px; opacity:0; transform:scale(0.6); transition:all .12s ease;}
  .check-field.checked .cf-box svg{opacity:1; transform:scale(1);}
  .tick-yes{color:var(--accent); font-weight:600;}
  .tick-no{color:var(--text-dim);}

  table{width:100%; border-collapse:collapse; font-size:12.8px;}
  thead th{
    text-align:left; color:var(--text-dim); font-weight:500; font-size:11px;
    text-transform:uppercase; letter-spacing:0.4px; padding:8px 10px; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td{padding:9px 10px; border-bottom:1px solid rgba(38,48,63,0.6); vertical-align:middle;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .table-scroll{overflow-x:auto; border-radius:8px;}
  .badge{
    display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px;
    background:var(--panel-2); border:1px solid var(--border); white-space:nowrap;
  }
  .badge.role-admin{color:var(--warn); border-color:rgba(245,166,35,0.4);}
  .badge.role-tecnico{color:var(--info); border-color:rgba(63,169,245,0.4);}

  .empty{
    text-align:center; padding:36px 20px; color:var(--text-dim); font-size:13px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--accent); color:var(--text);
    padding:10px 18px; border-radius:9px; font-size:13px; z-index:100;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); animation:toastIn .18s ease-out;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filters .field{margin-bottom:0; min-width:150px; flex:1;}

  .modal-bg{
    position:fixed; inset:0; background:rgba(6,9,15,0.7); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px;
    width:100%; max-width:360px;
  }
  .modal h3{font-size:15px; margin-bottom:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}

  .row-actions{display:flex; gap:6px;}
  .footer-note{text-align:center; color:var(--text-dim); font-size:11px; margin-top:26px;}
</style>
</head>
<body>

<div id="root"></div>

<script type="module">
/* ============================================================
   RELEVAMIENTO NETECO — versión Firebase
   Almacenamiento: Firestore (colecciones "usuarios" y "entradas").
   Autenticación de acceso a Firestore: Anónima (solo habilita la
   conexión); el login real de cada persona lo maneja esta app
   contra la colección "usuarios".
   ============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc,
  collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// ⬇⬇⬇ REEMPLAZÁ ESTO por el firebaseConfig que copiaste de la consola ⬇⬇⬇
const firebaseConfig = {
  apiKey: "AIzaSyBcocsqnBFqiQVRBalvsVM1jL9ZwPvh5VM",
  authDomain: "relevamiento-neteco.firebaseapp.com",
  projectId: "relevamiento-neteco",
  storageBucket: "relevamiento-neteco.firebasestorage.app",
  messagingSenderId: "1068842986414",
  appId: "1:1068842986414:web:2d3f92d7fb358f4756f63f"
};
// ⬆⬆⬆ REEMPLAZÁ ESTO por el firebaseConfig que copiaste de la consola ⬆⬆⬆

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

const USERS_COL = "usuarios";
const ENTRIES_COL = "entradas";

const FIELD_GROUPS = [
  {
    title: "1. Planta de Energía",
    kind: "check",
    fields: [
      {key:"plantaHuawei", label:"Huawei", type:"check",
        subFields:[{key:"modeloHuawei", label:"Modelo controladora (Huawei)", formLabel:"Modelo controladora", type:"text", placeholder:"Modelo controladora"}]},
      {key:"plantaZte", label:"ZTE", type:"check",
        subFields:[{key:"modeloZte", label:"Modelo controladora (ZTE)", formLabel:"Modelo controladora", type:"text", placeholder:"Modelo controladora"}]},
      {key:"plantaEmerson", label:"Emerson", type:"check",
        subFields:[{key:"modeloEmerson", label:"Modelo controladora (Emerson)", formLabel:"Modelo controladora", type:"text", placeholder:"Modelo controladora"}]},
      {key:"plantaEnclouse", label:"Enclouse", type:"check",
        subFields:[{key:"modeloEnclouse", label:"Modelo controladora (Enclouse)", formLabel:"Modelo controladora", type:"text", placeholder:"Modelo controladora"}]},
      {key:"plantaEaton", label:"Eaton", type:"check",
        subFields:[{key:"modeloEaton", label:"Modelo controladora (Eaton)", formLabel:"Modelo controladora", type:"text", placeholder:"Modelo controladora"}]},
      {key:"plantaOtros", label:"Otros — Planta de Energía", type:"text", formLabel:"Otros", placeholder:"Escribí la marca"},
    ]
  },
  {
    title: "2. Baterías",
    kind: "text",
    fields: [
      {key:"bateriaA", label:"Batería A — Marca/modelo", type:"text", formLabel:"Batería A", placeholder:"Marca/modelo"},
      {key:"bateriaB", label:"Batería B — Marca/modelo", type:"text", formLabel:"Batería B", placeholder:"Marca/modelo"},
      {key:"bateriaC", label:"Batería C — Marca/modelo", type:"text", formLabel:"Batería C", placeholder:"Marca/modelo"},
      {key:"bateriaD", label:"Batería D — Marca/modelo", type:"text", formLabel:"Batería D", placeholder:"Marca/modelo"},
      {key:"bateriaE", label:"Batería E — Marca/modelo", type:"text", formLabel:"Batería E", placeholder:"Marca/modelo"},
      {key:"bateriaF", label:"Batería F — Marca/modelo", type:"text", formLabel:"Batería F", placeholder:"Marca/modelo"},
    ]
  },
  {
    title: "3. Sensores Gabinetes",
    kind: "check",
    fields: [
      {key:"sensorTemperatura", label:"Temperatura", type:"check"},
      {key:"sensorHumedad", label:"Humedad", type:"check"},
      {key:"sensorHumo", label:"Humo", type:"check"},
      {key:"sensorPuerta", label:"Puerta", type:"check"},
      {key:"sensorWater", label:"Water", type:"check"},
    ]
  },
  {
    title: "4. Cableado",
    kind: "check",
    fields: [
      {key:"utpControladoraRbs", label:"11. Cableado de UTP desde controladora a RBS", type:"check"},
      {key:"cablePowerBateria", label:"12. Cableado de cable Power a batería", type:"check",
        subFields:[
          {key:"conexionDCDU", label:"Conexión en DCDU", type:"check"},
          {key:"conexionTermica", label:"Conexión en Térmica", type:"check"},
        ]},
      {key:"utpControladoraBateriaPrimaria", label:"13. Cableado de UTP desde Controladora a módulo de Batería primaria", type:"check"},
      {key:"cascadaEntreModulos", label:"14. Cableado de cascada entre módulos de batería", type:"check"},
      {key:"finCascadaBucle", label:"15. Conexión en Módulo de batería en final de Cascada Bucle", type:"check"},
      {key:"cableadoPuertaGabinete", label:"16. Cableado desde puerta gabinete a controladora", type:"check"},
    ]
  },
];

// Lista "plana" de todos los campos (incluye sub-campos como DCDU/Térmica),
// usada para tablas, exportación y lectura del formulario.
const FIELD_DEFS_FLAT = FIELD_GROUPS.flatMap(g =>
  g.fields.flatMap(f => f.subFields ? [f, ...f.subFields] : [f])
);


// Listado inicial de técnicos. Se cargan automáticamente la primera vez
// que se usa la app, con una contraseña provisoria igual para todos
// (NETECO_TECNICOS_PASS_INICIAL) que el administrador debería resetear
// individualmente desde la pestaña "Usuarios".
const TECNICOS_INICIALES = [
  "Pablo Giarrizzo",
  "Ivan Aparicio",
  "Jose Matteo",
  "Ricardo Sanchez",
  "Julian Vazquez",
  "Pablo Guzman",
  "Garcia Fernanda",
  "Cornero Berrutti Santiago",
  "Naterro Cesar Luis",
  "Macri, Damian",
];
const PASS_INICIAL_TECNICOS = "Neteco2026";

function slugUsername(nombre){
  return nombre
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/,/g, " ")
    .trim()
    .toLowerCase()
    .split(/\s+/)
    .join(".");
}

function buildDefaultUsers(){
  const users = { admin: {password:"admin123", nombre:"Administrador", role:"admin", mustChangePassword:true} };
  const seen = {};
  TECNICOS_INICIALES.forEach(nombreRaw=>{
    const nombre = nombreRaw.replace(/,\s*/g, ", ").trim();
    let u = slugUsername(nombreRaw);
    if(seen[u]){ seen[u]++; u = `${u}${seen[u]}`; } else { seen[u]=1; }
    users[u] = {password: PASS_INICIAL_TECNICOS, nombre, role:"tecnico", mustChangePassword:true};
  });
  return users;
}

let state = {
  users: null,
  entries: null,
  session: null, // {username, nombre, role}
  pendingPasswordChange: null, // {username, nombre, role} while user must set a new password
  view: "login",
  adminTab: "carga",
  loading: true,
  error: null,
};

const root = document.getElementById("root");

/* ---------------- storage helpers (Firestore) ---------------- */

function waitForAuth(){
  return new Promise((resolve, reject)=>{
    signInAnonymously(auth).catch(reject);
    onAuthStateChanged(auth, (user)=>{
      if(user) resolve(user);
    });
  });
}

async function loadUsers(){
  const snap = await getDocs(collection(db, USERS_COL));
  if(snap.empty){
    const defaults = buildDefaultUsers();
    await saveUsers(defaults);
    return defaults;
  }
  const users = {};
  snap.forEach(d=>{ users[d.id] = d.data(); });
  return users;
}
async function saveUsers(users){
  const snap = await getDocs(collection(db, USERS_COL));
  const existingIds = [];
  snap.forEach(d=> existingIds.push(d.id));
  const targetIds = new Set(Object.keys(users));
  await Promise.all(Object.entries(users).map(([u, data])=> setDoc(doc(db, USERS_COL, u), data)));
  const toDelete = existingIds.filter(id=> !targetIds.has(id));
  await Promise.all(toDelete.map(id=> deleteDoc(doc(db, USERS_COL, id))));
}
async function loadEntries(){
  const snap = await getDocs(collection(db, ENTRIES_COL));
  const entries = [];
  snap.forEach(d=> entries.push({...d.data(), id:d.id}));
  return entries;
}
async function saveEntries(entries){
  const snap = await getDocs(collection(db, ENTRIES_COL));
  const existingIds = [];
  snap.forEach(d=> existingIds.push(d.id));
  const targetIds = new Set(entries.map(e=>e.id));
  await Promise.all(entries.map(e=> setDoc(doc(db, ENTRIES_COL, e.id), e))); 
  const toDelete = existingIds.filter(id=> !targetIds.has(id));
  await Promise.all(toDelete.map(id=> deleteDoc(doc(db, ENTRIES_COL, id))));
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function genPassword(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  let p=""; for(let i=0;i<8;i++) p+=chars[Math.floor(Math.random()*chars.length)];
  return p;
}
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`;
}

let toastTimer=null;
function showToast(msg){
  clearTimeout(toastTimer);
  let t = document.querySelector(".toast");
  if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  toastTimer = setTimeout(()=>{ t.remove(); }, 2600);
}

/* ---------------- init ---------------- */

async function init(){
  render(); // loading state
  try{
    await waitForAuth();
    state.users = await loadUsers();
    state.entries = await loadEntries();
  }catch(e){
    console.error(e);
    state.error = "No se pudo conectar con Firebase. Revisá que el firebaseConfig esté bien pegado en el archivo y que Firestore + Authentication (Anónimo) estén habilitados en la consola.";
  }
  state.loading = false;
  render();
}

/* ---------------- render dispatcher ---------------- */

function render(){
  if(state.loading){
    root.innerHTML = renderLoading();
    return;
  }
  if(state.pendingPasswordChange){
    root.innerHTML = renderForcePasswordChange();
    bindForcePasswordChange();
    return;
  }
  if(!state.session){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  if(state.session.role === "admin"){
    root.innerHTML = renderShell(renderAdmin());
  } else {
    root.innerHTML = renderShell(renderTecnico());
  }
  bindShell();
  if(state.session.role === "admin"){
    bindAdmin();
  } else {
    bindTecnico();
  }
}

function renderLoading(){
  return `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:13px;">
    Cargando Relevamiento Neteco…

}

function renderUserOptions(){

  const tecnicos = entries.filter(([u,v])=>v.role==="tecnico")
    .sort((a,b)=> (a[1].nombre||a[0]).localeCompare(b[1].nombre||b[0], "es"));
  const admins = entries.filter(([u,v])=>v.role==="admin")
    .sort((a,b)=> (a[1].nombre||a[0]).localeCompare(b[1].nombre||b[0], "es"));

function bindForcePasswordChange(){
  const doSave = async ()=>{
    const p1 = document.getElementById("fpc-pass1").value;
    const p2 = document.getElementById("fpc-pass2").value;
    const box = document.getElementById("fpc-error");
    if(!p1 || p1.length < 4){
      box.innerHTML = `<div class="error-msg">La contraseña debe tener al menos 4 caracteres.</div>`;
      return;
    }
    if(p1 !== p2){
      box.innerHTML = `<div class="error-msg">Las contraseñas no coinciden.</div>`;
      return;
    }
    const pending = state.pendingPasswordChange;
    state.users = await loadUsers();
    if(!state.users[pending.username]){
      box.innerHTML = `<div class="error-msg">Tu usuario ya no existe. Pedile al administrador que te vuelva a crear el acceso.</div>`;
      return;
    }
    state.users[pending.username].password = p1;
    state.users[pending.username].mustChangePassword = false;
    await saveUsers(state.users);
    state.session = {username: pending.username, nombre: pending.nombre, role: pending.role};
    state.pendingPasswordChange = null;
    render();
    showToast("Contraseña actualizada");
  };
  document.getElementById("fpc-submit").addEventListener("click", doSave);
  document.getElementById("fpc-pass2").addEventListener("keydown", (e)=>{

}

function bindLogin(){
  const form = document.getElementById("login-form");
  if(!form) return;
  const doLogin = ()=>{
    const u = document.getElementById("login-user").value.trim();
    const p = document.getElementById("login-pass").value;
    const box = document.getElementById("login-error");
    if(!u){
      box.innerHTML = `<div class="error-msg">Seleccioná tu nombre de la lista.</div>`;
      return;
    }
    const user = state.users ? state.users[u] : null;
    if(!user || user.password !== p){
      box.innerHTML = `<div class="error-msg">Usuario o contraseña incorrectos.</div>`;
      return;
    }
    if(user.mustChangePassword){
      state.pendingPasswordChange = {username:u, nombre:user.nombre || u, role:user.role};
      state.error = null;
      render();
      return;
    }
    state.session = {username:u, nombre:user.nombre || u, role:user.role};
    state.error = null;
    render();
  };
  document.getElementById("login-submit").addEventListener("click", doLogin);
  form.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); doLogin(); }
  });
}

function tickMark(v){
  return v
    ? `<span class="tick-yes">✓</span>`
    : `<span class="tick-no">—</span>`;
}

function fieldCell(f, e){
  if(f.type === "text"){
    const v = e[f.key];
    return v ? escapeHtml(v) : `<span class="tick-no">—</span>`;
  }
  return tickMark(e[f.key]);
}

function rowHtml(e){
  return `<tr>
    <td class="mono">${fmtDate(e.fecha)}</td>
    <td class="mono">${escapeHtml(e.sitio)}</td>
    ${FIELD_DEFS_FLAT.map(f=>`<td>${fieldCell(f, e)}</td>`).join("")}
    <td style="max-width:220px; white-space:normal; color:var(--text-dim);">${escapeHtml(e.comentarios || "—")}</td>
  </tr>`;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str ?? "";
  return d.innerHTML;
}

function bindTecnico(){
  const form = document.getElementById("entry-form");

  FIELD_DEFS_FLAT.filter(f=>f.type==="check").forEach(f=>{
    const wrap = document.getElementById(`wrap-${f.key}`);
    const box = document.getElementById(`f-${f.key}`);
    box.addEventListener("change", ()=>{
      wrap.classList.toggle("checked", box.checked);
    });
  });

  // Puntos con sub-campos (ej. punto 12 → DCDU/Térmica, marcas de planta →
  // "Modelo controladora"): al marcar el ítem padre se despliega el detalle.
  FIELD_GROUPS.flatMap(g=>g.fields).filter(f=>f.subFields).forEach(f=>{
    const parentBox = document.getElementById(`f-${f.key}`);
    const subWrap = document.getElementById(`sub-${f.key}`);
    const syncVisibility = ()=>{
      const show = parentBox.checked;
      subWrap.style.display = show ? "flex" : "none";
      subWrap.classList.toggle("hidden", !show);
      if(!show){
        f.subFields.forEach(sf=>{
          const sfEl = document.getElementById(`f-${sf.key}`);
          if(sf.type === "text"){
            sfEl.value = "";
          } else {
            sfEl.checked = false;
            const sfWrap = document.getElementById(`wrap-${sf.key}`);
            if(sfWrap) sfWrap.classList.remove("checked");
          }
        });
      }
    };
    parentBox.addEventListener("change", syncVisibility);
    syncVisibility();
  });

  const doSave = async ()=>{
    const entry = {
      id: genId(),
      tecnicoUsuario: state.session.username,
      tecnicoNombre: state.session.nombre,
      fecha: document.getElementById("f-fecha").value,
      sitio: document.getElementById("f-sitio").value.trim(),
      comentarios: document.getElementById("f-comentarios").value.trim(),
      timestamp: Date.now(),
    };
    if(!entry.fecha || !entry.sitio){
      document.getElementById("form-msg").innerHTML = `<div class="error-msg">Completá al menos la fecha y el sitio.</div>`;
      return;
    }
    FIELD_DEFS_FLAT.forEach(f=>{
      const el = document.getElementById(`f-${f.key}`);
      entry[f.key] = f.type === "text" ? el.value.trim() : el.checked;
    });
    const btn = document.getElementById("entry-submit");
    btn.disabled = true; btn.textContent = "Guardando…";
    try{
      // re-fetch latest to avoid clobbering concurrent writes as much as possible
      state.entries = await loadEntries();
      state.entries.push(entry);
      await saveEntries(state.entries);
      document.getElementById("form-msg").innerHTML = `<div class="ok-msg">Relevamiento guardado correctamente.</div>`;
      render();
      showToast("Relevamiento guardado");
    }catch(err){
      document.getElementById("form-msg").innerHTML = `<div class="error-msg">No se pudo guardar. Probá de nuevo.</div>`;
      btn.disabled = false; btn.textContent = "Guardar relevamiento";
    }
  };
  document.getElementById("entry-submit").addEventListener("click", doSave);
  form.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); doSave(); }
  });
}

function getFilteredEntries(){

  const desde = document.getElementById("fl-desde")?.value || "";

  return state.entries
    .filter(e=> !tecnico || e.tecnicoUsuario === tecnico)
    .filter(e=> !sitio || (e.sitio||"").toLowerCase().includes(sitio))
    .filter(e=> !desde || e.fecha >= desde)
    .filter(e=> !hasta || e.fecha <= hasta)
    .sort((a,b)=> b.timestamp - a.timestamp);

          ? `<tr><td colspan="${3 + FIELD_DEFS_FLAT.length + 2}"><div class="empty">No hay relevamientos que coincidan con los filtros. Los técnicos todavía no cargaron ninguno, o probá ajustar los filtros.</div></td></tr>`

function getMissingTecnicos(){
  const seen = {};
  return TECNICOS_INICIALES
    .map(nombreRaw=>{
      const nombre = nombreRaw.replace(/,\s*/g, ", ").trim();
      let u = slugUsername(nombreRaw);
      if(seen[u]){ seen[u]++; u = `${u}${seen[u]}`; } else { seen[u]=1; }
      return {u, nombre};
    })
    .filter(({u})=> !state.users[u]);
}

function renderAdminUsers(){
  const users = Object.entries(state.users);
  const missing = getMissingTecnicos();
  return `
  ${missing.length > 0 ? `
  <div class="panel" style="border-color:rgba(245,166,35,0.4);">
    <div class="panel-head">
      <div>
        <h2>Técnicos predefinidos pendientes de cargar</h2>
        <div class="desc">Faltan ${missing.length} usuario(s) del listado inicial de técnicos: ${missing.map(m=>escapeHtml(m.nombre)).join(", ")}.</div>
      </div>
      <button class="btn primary small" id="btn-seed-tecnicos">Cargar técnicos predefinidos</button>
    </div>
  </div>` : ""}
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>Agregar usuario</h2>
        <div class="desc">Creá accesos para técnicos o nuevos administradores.</div>
      </div>
    </div>
    <div id="user-msg"></div>
    <form id="add-user-form">
      <div class="grid3">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="nu-user" required>
        </div>
        <div class="field">
          <label>Nombre y apellido</label>
          <input type="text" id="nu-nombre" required>
        </div>
        <div class="field">
          <label>Rol</label>
          <select id="nu-role">
            <option value="tecnico">Técnico</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
      </div>
      <div class="field" style="max-width:260px;">
        <label>Contraseña inicial</label>
        <input type="text" id="nu-pass" class="mono" value="${genPassword()}" required>
      </div>
      <button type="button" id="add-user-submit" class="btn primary">Crear usuario</button>
    </form>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>Usuarios del equipo</h2>
        <div class="desc">${users.length} usuario(s) con acceso.</div>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Cargas</th><th></th></tr></thead>
        <tbody>
          ${users.map(([u,v])=>{
            const count = state.entries.filter(e=>e.tecnicoUsuario===u).length;
            return `<tr>
              <td class="mono">${escapeHtml(u)}</td>
              <td>${escapeHtml(v.nombre||"—")}</td>
              <td><span class="badge role-${v.role}">${v.role==="admin"?"Admin":"Técnico"}</span></td>
              <td class="mono">${count}</td>
              <td>
                <div class="row-actions">
                  <button class="btn small reset-pass" data-u="${u}">Resetear clave</button>
                  <button class="btn small danger remove-user" data-u="${u}">Quitar</button>
                </div>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function bindAdmin(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      state.adminTab = t.dataset.tab;
      render();
    });
  });

  if(state.adminTab === "carga"){
    renderAdminTable();
    ["fl-tecnico","fl-sitio","fl-desde","fl-hasta"].forEach(id=>{
      document.getElementById(id).addEventListener("input", renderAdminTable);
      document.getElementById(id).addEventListener("change", renderAdminTable);
    });
    document.getElementById("btn-export").addEventListener("click", exportToExcel);
    document.getElementById("btn-refresh").addEventListener("click", async ()=>{
      const btn = document.getElementById("btn-refresh");
      btn.disabled = true; btn.textContent = "Actualizando…";
      state.entries = await loadEntries();
      state.users = await loadUsers();
      render();
      showToast("Datos actualizados");
    });
  } else {
    const seedBtn = document.getElementById("btn-seed-tecnicos");
    if(seedBtn){
      seedBtn.addEventListener("click", async ()=>{
        state.users = await loadUsers();
        const missing = getMissingTecnicos();
        missing.forEach(({u, nombre})=>{
          state.users[u] = {password: PASS_INICIAL_TECNICOS, nombre, role:"tecnico", mustChangePassword:true};
        });
        await saveUsers(state.users);
        showToast(`${missing.length} técnico(s) cargado(s) con clave "${PASS_INICIAL_TECNICOS}"`);
        render();
      });
    }
    const form = document.getElementById("add-user-form");
    const doCreate = async ()=>{
      const u = document.getElementById("nu-user").value.trim();
      const nombre = document.getElementById("nu-nombre").value.trim();
      const role = document.getElementById("nu-role").value;
      const pass = document.getElementById("nu-pass").value;
      const msg = document.getElementById("user-msg");
      if(!u || !pass){
        msg.innerHTML = `<div class="error-msg">Completá usuario y contraseña.</div>`;
        return;
      }
      state.users = await loadUsers();
      if(state.users[u]){
        msg.innerHTML = `<div class="error-msg">Ese usuario ya existe.</div>`;
        return;
      }
      state.users[u] = {password:pass, nombre, role, mustChangePassword:true};
      await saveUsers(state.users);
      showToast(`Usuario "${u}" creado`);
      render();
    };
    document.getElementById("add-user-submit").addEventListener("click", doCreate);
    form.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); doCreate(); }
    });

    document.querySelectorAll(".reset-pass").forEach(btn=>{
      btn.addEventListener("click", ()=> openResetModal(btn.dataset.u));
    });
    document.querySelectorAll(".remove-user").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const u = btn.dataset.u;
        if(u === state.session.username){
          alert("No podés eliminar tu propio usuario mientras estás conectado con él.");
          return;
        }
        const adminsLeft = Object.values(state.users).filter(v=>v.role==="admin").length;
        if(state.users[u].role === "admin" && adminsLeft <= 1){
          alert("No podés eliminar al único administrador restante.");
          return;
        }
        if(!confirm(`¿Quitar el acceso de "${u}"? Sus relevamientos ya cargados se conservan.`)) return;
        state.users = await loadUsers();
        delete state.users[u];
        await saveUsers(state.users);
        showToast("Usuario eliminado");
        render();
      });
    });
  }
}

function openResetModal(username){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const suggested = genPassword();
  bg.innerHTML = `
    <div class="modal">
      <h3>Resetear clave de "${escapeHtml(username)}"</h3>
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="text" id="rp-pass" class="mono" value="${suggested}">
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="rp-cancel">Cancelar</button>
        <button class="btn primary" id="rp-confirm">Guardar clave</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#rp-cancel").addEventListener("click", ()=> bg.remove());
  bg.addEventListener("click", (e)=>{ if(e.target === bg) bg.remove(); });
  bg.querySelector("#rp-confirm").addEventListener("click", async ()=>{
    const newPass = bg.querySelector("#rp-pass").value;
    if(!newPass){ return; }
    state.users = await loadUsers();
    if(state.users[username]){
      state.users[username].password = newPass;
      state.users[username].mustChangePassword = true;
      await saveUsers(state.users);
      showToast(`Clave de "${username}" actualizada`);
    }
    bg.remove();
  });
}

/* ---------------- export ---------------- */

function exportToExcel(){
  const rows = getFilteredEntries();
  const data = rows.map(e=>{
    const row = {
      "Fecha": fmtDate(e.fecha),
      "Sitio": e.sitio,
      "Técnico": e.tecnicoNombre || e.tecnicoUsuario,
    };
    FIELD_DEFS_FLAT.forEach(f=>{
      row[f.label] = f.type === "text" ? (e[f.key] || "") : (e[f.key] ? "✓" : "");
    });
    row["Comentarios"] = e.comentarios || "";
    return row;
  });
  if(data.length === 0){
    alert("No hay datos para exportar con los filtros actuales.");
    return;
  }
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = Object.keys(data[0]).map(k => ({wch: Math.max(14, k.length+2)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Relevamiento Neteco");
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Relevamiento_Neteco_${stamp}.xlsx`);
  showToast("Excel exportado");
}

init();
</script>
